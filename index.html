<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eko Kitchen Co. | In-Room Menu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 pb-36 font-sans">

  <header class="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="font-black text-xl tracking-wider text-amber-400">EKO KITCHEN CO.</h1>
        <p class="text-xs text-slate-300 font-medium">In-Room Dining • 08 a.m. to 10 p.m.</p>
      </div>
      <div class="bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold px-3 py-1 rounded-full">
        Prepaid Orders
      </div>
    </div>
  </header>

  <div class="bg-red-600 text-white text-xs text-center py-2 px-4 font-bold tracking-wide shadow-inner">
    🎁 OFFERS: 10% OFF on orders > ₹299 | 30% OFF on orders > ₹999
  </div>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-3">
      <h3 class="text-xs font-black uppercase tracking-wider text-amber-600">Resident Info</h3>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Full Name *</label>
          <input type="text" id="student-name" placeholder="e.g. Rahul" 
                 class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-xs font-medium">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Room No. *</label>
          <input type="text" id="room-number" placeholder="e.g. 204" 
                 class="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none text-xs font-medium">
        </div>
      </div>
    </div>

    <div class="sticky top-16 z-20 bg-slate-100 py-1">
      <div class="flex bg-white p-1 rounded-2xl shadow-sm border border-slate-200 gap-1 text-xs font-black">
        <button onclick="switchTab('mains')" id="tab-mains" class="tab-btn flex-1 py-2 rounded-xl bg-amber-500 text-slate-950 transition">Mains</button>
        <button onclick="switchTab('snacks')" id="tab-snacks" class="tab-btn flex-1 py-2 rounded-xl text-slate-500 hover:bg-slate-100 transition">Snacks</button>
        <button onclick="switchTab('beverages')" id="tab-beverages" class="tab-btn flex-1 py-2 rounded-xl text-slate-500 hover:bg-slate-100 transition">Beverages</button>
        <button onclick="switchTab('desserts')" id="tab-desserts" class="tab-btn flex-1 py-2 rounded-xl text-slate-500 hover:bg-slate-100 transition">Desserts</button>
      </div>
    </div>

    <div id="cart-details-card" class="bg-white p-4 rounded-2xl shadow-sm border border-amber-300 space-y-3 hidden">
      <div class="flex justify-between items-center border-b border-slate-200 pb-2">
        <h3 class="text-xs font-black uppercase tracking-wider text-slate-900">Your Selected Items</h3>
        <button onclick="clearCart()" class="text-[11px] font-bold text-red-500 hover:underline">Clear All</button>
      </div>
      <div id="cart-item-list" class="space-y-2 text-xs"></div>
    </div>

    <section id="section-mains" class="menu-section space-y-3">
      
      <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 flex gap-3 items-center">
        <img src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=300&q=80" alt="Pizza" class="w-16 h-16 rounded-xl object-cover">
        <div class="flex-1 space-y-1.5">
          <div class="flex justify-between items-center">
            <h3 class="font-bold text-sm text-slate-800">Pizza</h3>
            <span class="text-[10px] bg-slate-100 text-slate-600 font-bold px-1.5 py-0.5 rounded">4 Slices</span>
          </div>
          <div class="grid grid-cols-2 gap-1.5">
            <button onclick="openCustomizationModal('Veg Pizza (4 slices)', 130, 'pizza')" class="bg-amber-50 border border-amber-300 hover:bg-amber-500 hover:text-slate-950 py-1 rounded-lg text-[10px] font-bold">+ Veg ₹130</button>
            <button onclick="openCustomizationModal('Margherita Pizza (4 slices)', 150, 'pizza')" class="bg-amber-50 border border-amber-300 hover:bg-amber-500 hover:text-slate-950 py-1 rounded-lg text-[10px] font-bold">+ Margherita ₹150</button>
            <button onclick="openCustomizationModal('Paneer Pizza (4 slices)', 160, 'pizza')" class="bg-amber-50 border border-amber-300 hover:bg-amber-500 hover:text-slate-950 py-1 rounded-lg text-[10px] font-bold">+ Paneer ₹160</button>
